services:
  ui:
    build:
      context: .
      target: ui
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ORIGIN: http://localhost:8080
      RETRIEVAL_PROVIDER: ${RETRIEVAL_PROVIDER:-ollama}
      RETRIEVAL_MINIMUM_SCORE: ${RETRIEVAL_MINIMUM_SCORE:-0.25}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-all-minilm}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-ollama}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
