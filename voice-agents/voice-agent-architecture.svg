<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#f8fafc"/>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 20px Arial, sans-serif; fill: #475569; }
    .box { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 16; }
    .boxblue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; }
    .boxgreen { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 16; }
    .boxamber { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 16; }
    .boxname { font: 700 22px Arial, sans-serif; fill: #0f172a; }
    .boxtext { font: 18px Arial, sans-serif; fill: #334155; }
    .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .small { font: 16px Arial, sans-serif; fill: #64748b; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
  </defs>

  <text x="720" y="58" text-anchor="middle" class="title">Voice Agent Reference Architecture</text>
  <text x="720" y="92" text-anchor="middle" class="subtitle">Browser call or phone call → controlled FAQ response → transcript</text>

  <!-- callers -->
  <rect x="55" y="170" width="210" height="150" class="boxblue"/>
  <text x="160" y="218" text-anchor="middle" class="boxname">Browser Caller</text>
  <text x="160" y="254" text-anchor="middle" class="boxtext">React UI</text>
  <text x="160" y="282" text-anchor="middle" class="boxtext">Make call / Show conversation</text>

  <rect x="55" y="410" width="210" height="150" class="boxblue"/>
  <text x="160" y="458" text-anchor="middle" class="boxname">Phone Caller</text>
  <text x="160" y="494" text-anchor="middle" class="boxtext">PSTN / test number</text>
  <text x="160" y="522" text-anchor="middle" class="boxtext">Ordinary telephone</text>

  <!-- voice transport -->
  <rect x="350" y="170" width="230" height="150" class="boxamber"/>
  <text x="465" y="218" text-anchor="middle" class="boxname">Browser Voice Adapter</text>
  <text x="465" y="254" text-anchor="middle" class="boxtext">WebRTC / provider SDK</text>
  <text x="465" y="282" text-anchor="middle" class="boxtext">Call status + audio</text>

  <rect x="350" y="410" width="230" height="150" class="boxamber"/>
  <text x="465" y="458" text-anchor="middle" class="boxname">Twilio Voice</text>
  <text x="465" y="494" text-anchor="middle" class="boxtext">ConversationRelay</text>
  <text x="465" y="522" text-anchor="middle" class="boxtext">STT + TTS transport</text>

  <!-- gateway -->
  <rect x="680" y="250" width="250" height="230" class="box"/>
  <text x="805" y="298" text-anchor="middle" class="boxname">API / WebSocket Gateway</text>
  <text x="805" y="338" text-anchor="middle" class="boxtext">Signature validation</text>
  <text x="805" y="368" text-anchor="middle" class="boxtext">Rate limiting</text>
  <text x="805" y="398" text-anchor="middle" class="boxtext">Session + payload checks</text>
  <text x="805" y="428" text-anchor="middle" class="boxtext">Trace / correlation IDs</text>

  <!-- core -->
  <rect x="1020" y="250" width="320" height="230" class="boxgreen"/>
  <text x="1180" y="298" text-anchor="middle" class="boxname">Voice Orchestrator</text>
  <text x="1180" y="338" text-anchor="middle" class="boxtext">Call state machine</text>
  <text x="1180" y="368" text-anchor="middle" class="boxtext">Turn state + idempotency</text>
  <text x="1180" y="398" text-anchor="middle" class="boxtext">Conversation store</text>
  <text x="1180" y="428" text-anchor="middle" class="boxtext">Metrics + trace context</text>

  <!-- FAQ -->
  <rect x="1020" y="610" width="320" height="150" class="boxblue"/>
  <text x="1180" y="658" text-anchor="middle" class="boxname">FAQ / Intent Engine</text>
  <text x="1180" y="694" text-anchor="middle" class="boxtext">Curated synthetic answers</text>
  <text x="1180" y="722" text-anchor="middle" class="boxtext">Normalization + safe fallback</text>

  <!-- evidence -->
  <rect x="680" y="610" width="250" height="150" class="box"/>
  <text x="805" y="658" text-anchor="middle" class="boxname">Evidence / Telemetry</text>
  <text x="805" y="694" text-anchor="middle" class="boxtext">Transcripts + call status</text>
  <text x="805" y="722" text-anchor="middle" class="boxtext">Latency + errors + trace</text>

  <!-- arrows -->
  <path d="M265 245 H350" class="arrow"/>
  <path d="M265 485 H350" class="arrow"/>
  <path d="M580 245 H680" class="arrow"/>
  <path d="M580 485 H680" class="arrow"/>
  <path d="M930 365 H1020" class="arrow"/>
  <path d="M1180 480 V610" class="arrow"/>
  <path d="M1020 685 H930" class="arrow"/>

  <!-- feedback labels -->
  <text x="620" y="224" class="small">Voice/audio</text>
  <text x="620" y="464" class="small">Twilio callbacks</text>
  <text x="957" y="342" class="small">Turns</text>
  <text x="1194" y="565" class="small">Resolve</text>
  <text x="980" y="664" class="small">Response</text>

  <!-- bottom principles -->
  <rect x="55" y="780" width="1285" height="80" rx="16" fill="#0f172a"/>
  <text x="697" y="812" text-anchor="middle" style="font:700 18px Arial, sans-serif; fill:#ffffff">Production principles</text>
  <text x="697" y="842" text-anchor="middle" style="font:16px Arial, sans-serif; fill:#cbd5e1">Opaque sessions · encrypted storage · signed callbacks · bounded retries · no side effects before confirmation · deterministic core</text>
</svg>
